<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- 装饰圆环 -->
  <circle cx="650" cy="150" r="120" stroke="#2563eb" stroke-width="1" fill="none" opacity="0.15"/>
  <circle cx="650" cy="150" r="80" stroke="#7c3aed" stroke-width="1" fill="none" opacity="0.1"/>
  <circle cx="650" cy="150" r="40" stroke="#2563eb" stroke-width="2" fill="none" opacity="0.2"/>
  
  <!-- 装饰点阵 -->
  <g opacity="0.15">
    <circle cx="100" cy="80" r="2" fill="#2563eb"/>
    <circle cx="130" cy="80" r="2" fill="#2563eb"/>
    <circle cx="160" cy="80" r="2" fill="#2563eb"/>
    <circle cx="100" cy="110" r="2" fill="#2563eb"/>
    <circle cx="130" cy="110" r="2" fill="#2563eb"/>
    <circle cx="160" cy="110" r="2" fill="#2563eb"/>
    <circle cx="100" cy="140" r="2" fill="#2563eb"/>
    <circle cx="130" cy="140" r="2" fill="#2563eb"/>
    <circle cx="160" cy="140" r="2" fill="#2563eb"/>
  </g>
  
  <!-- 书本 -->
  <g transform="translate(280, 180)">
    <rect x="0" y="0" width="240" height="180" rx="8" fill="url(#grad1)" stroke="#2563eb" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="8" rx="4" fill="#2563eb" opacity="0.3"/>
    <rect x="20" y="40" width="160" height="6" rx="3" fill="#2563eb" opacity="0.2"/>
    <rect x="20" y="56" width="180" height="6" rx="3" fill="#2563eb" opacity="0.2"/>
    <rect x="20" y="72" width="140" height="6" rx="3" fill="#2563eb" opacity="0.2"/>
    <rect x="20" y="100" width="200" height="60" rx="6" fill="#7c3aed" opacity="0.15"/>
    <circle cx="50" cy="130" r="15" fill="#7c3aed" opacity="0.3"/>
    <path d="M45 130 L50 125 L55 130 L50 135 Z" fill="#7c3aed" opacity="0.6"/>
    <rect x="80" y="115" width="100" height="6" rx="3" fill="#7c3aed" opacity="0.3"/>
    <rect x="80" y="130" width="80" height="6" rx="3" fill="#7c3aed" opacity="0.2"/>
    <rect x="80" y="145" width="60" height="6" rx="3" fill="#7c3aed" opacity="0.2"/>
  </g>
  
  <!-- 灯泡 (AI智能) -->
  <g transform="translate(580, 320)">
    <circle cx="40" cy="40" r="35" fill="url(#grad2)" opacity="0.9"/>
    <path d="M40 15 C25 15 15 28 15 40 C15 52 22 60 30 65 L30 75 L50 75 L50 65 C58 60 65 52 65 40 C65 28 55 15 40 15 Z" fill="white" opacity="0.9"/>
    <rect x="32" y="75" width="16" height="8" rx="2" fill="white" opacity="0.7"/>
    <rect x="35" y="83" width="10" height="6" rx="2" fill="white" opacity="0.5"/>
    <!-- 光线 -->
    <line x1="40" y1="5" x2="40" y2="0" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
    <line x1="15" y1="15" x2="10" y2="10" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
    <line x1="65" y1="15" x2="70" y2="10" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
    <line x1="5" y1="40" x2="0" y2="40" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
    <line x1="75" y1="40" x2="80" y2="40" stroke="#2563eb" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- 图表卡片 -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="white" stroke="#e5e7eb" stroke-width="2" opacity="0.9"/>
    <rect x="20" y="20" width="60" height="8" rx="4" fill="#2563eb" opacity="0.3"/>
    <!-- 柱状图 -->
    <rect x="30" y="80" width="20" height="40" rx="4" fill="#2563eb" opacity="0.6"/>
    <rect x="60" y="60" width="20" height="60" rx="4" fill="#2563eb" opacity="0.7"/>
    <rect x="90" y="45" width="20" height="75" rx="4" fill="#2563eb" opacity="0.8"/>
    <rect x="120" y="55" width="20" height="65" rx="4" fill="#7c3aed" opacity="0.6"/>
    <rect x="150" y="35" width="20" height="85" rx="4" fill="#7c3aed" opacity="0.7"/>
    <!-- 趋势线 -->
    <path d="M40 75 L70 55 L100 40 L130 50 L160 30" stroke="#10b981" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="40" cy="75" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="70" cy="55" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="100" cy="40" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="130" cy="50" r="3" fill="#10b981" opacity="0.8"/>
    <circle cx="160" cy="30" r="3" fill="#10b981" opacity="0.8"/>
  </g>
  
  <!-- 知识图谱节点 -->
  <g transform="translate(520, 100)">
    <circle cx="0" cy="0" r="20" fill="#2563eb" opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <circle cx="80" cy="-30" r="15" fill="#7c3aed" opacity="0.2" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="100" cy="40" r="18" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="60" r="12" fill="#f97316" opacity="0.2" stroke="#f97316" stroke-width="2"/>
    <line x1="0" y1="0" x2="80" y2="-30" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="100" y2="40" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="0" x2="40" y2="60" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
    <line x1="80" y1="-30" x2="100" y2="40" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
    <line x1="100" y1="40" x2="40" y2="60" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- 浮动装饰元素 -->
  <circle cx="700" cy="450" r="6" fill="#2563eb" opacity="0.15"/>
  <circle cx="720" cy="480" r="4" fill="#7c3aed" opacity="0.15"/>
  <circle cx="680" cy="500" r="8" fill="#10b981" opacity="0.1"/>
  <rect x="50" y="520" width="12" height="12" rx="2" fill="#2563eb" opacity="0.1" transform="rotate(45 56 526)"/>
  <rect x="750" y="200" width="8" height="8" rx="2" fill="#7c3aed" opacity="0.1" transform="rotate(30 754 204)"/>
  
  <!-- 波浪底部装饰 -->
  <path d="M0 560 Q200 520 400 560 T800 560 L800 600 L0 600 Z" fill="#2563eb" opacity="0.05"/>
  <path d="M0 580 Q200 550 400 580 T800 580 L800 600 L0 600 Z" fill="#7c3aed" opacity="0.03"/>
</svg>
